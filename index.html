<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Interactive Scrapbook ❤️</title>
<style>
body, html {margin:0;padding:0;font-family:'Trebuchet MS',sans-serif;overflow:hidden;background:#ffeef5;}
.container {display:flex;width:500vw;transition:transform 0.5s ease;height:100vh;}
.page {flex:0 0 100vw;height:100vh;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow-y:auto;}
h1,h2,p {color:#ff2f6d;margin:10px;}
.gallery img {width:200px;margin:10px;border-radius:15px;transition:0.3s;}
.gallery img:hover {transform:scale(1.05);}
button {padding:14px 25px;font-size:16px;background:#ff2f6d;border:none;color:white;border-radius:12px;cursor:pointer;margin:10px;}
button:hover {background:#e91e63;}
.heart {position:absolute;color:#ff2f6d;animation:explode 0.8s ease-out forwards;pointer-events:none;}
@keyframes explode {0%{transform:scale(0);opacity:1;}50%{transform:scale(1.5);opacity:1;}100%{transform:scale(1.8);opacity:0;}}
.typewriter {border-right:3px solid #ff2f6d;white-space:nowrap;overflow:hidden;font-size:18px;}
#countdown {font-size:24px;color:#ff2f6d;margin-top:10px;}
iframe.music {width:1px;height:1px;position:fixed;top:0;left:0;border:none;}
</style>
</head>
<body>

<!-- Visible but tiny YouTube audio player -->
<iframe class="music" src="https://www.youtube.com/embed/8SYPKQMW_2Q?autoplay=1&loop=1&playlist=8SYPKQMW_2Q&mute=0" allow="autoplay"></iframe>

<div class="container" id="container">

    <!-- Page 1 -->
    <div class="page" style="background:linear-gradient(135deg,#ffd6e7,#ffeef5);">
        <h1>13 Months With My Pookie ❤️</h1>
        <p>Started talking: 14 Dec 2024 | Started dating: 14 Feb 2025</p>
        <div id="countdown">Countdown to June: </div>
    </div>

    <!-- Page 2 -->
    <div class="page" style="background:#fff0f5;">
        <h2>Waiting for June 💌</h2>
        <p class="typewriter" id="msg1"></p>
        <p class="typewriter" id="msg2"></p>
    </div>

    <!-- Page 3 -->
    <div class="page" style="background:#ffe6ef;">
        <h2>Our Scrapbook 📖</h2>
        <div class="gallery">
            <img src="IMG_2475.jpeg">
            <img src="IMG_1753.jpeg">
            <img src="IMG_1755.jpeg">
        </div>
    </div>

    <!-- Page 4 -->
    <div class="page" style="background:#fff0f5;">
        <h2>Love Letter 💌</h2>
        <p class="typewriter" id="msg3"></p>
        <button onclick="explodeHeart()">Click Me for Love ❤️</button>
    </div>

</div>

<script>
// Swipable pages
let container = document.getElementById('container');
let currentPage = 0;
document.body.addEventListener('wheel', e => {
    if(e.deltaY > 0) currentPage = Math.min(currentPage+1, container.children.length-1);
    else currentPage = Math.max(currentPage-1, 0);
    container.style.transform = `translateX(${-100*currentPage}vw)`;
});

// Typewriter
function typeWriter(id,text,delay){
    let i=0, el=document.getElementById(id);
    function typing(){
        if(i<text.length){el.innerHTML+=text.charAt(i);i++;setTimeout(typing,delay);}
    }
    typing();
}

typeWriter("msg1","Every day I think about June coming and us finally meeting soon.",50);
typeWriter("msg2","The distance is hard, but just thinking of you keeps me smiling! ❤️",50);
typeWriter("msg3","My Pookie, these 13 months with you have been the most beautiful part of my life. I can’t wait to hold you.",50);

// Countdown
function updateCountdown(){
    let now=new Date(), june=new Date(now.getFullYear(),5,1);
    if(now>june) june.setFullYear(june.getFullYear()+1);
    let diff=june-now;
    let days=Math.floor(diff/(1000*60*60*24));
    let hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let mins=Math.floor((diff%(1000*60*60))/(1000*60));
    document.getElementById('countdown').innerText=`Countdown to June: ${days}d ${hours}h ${mins}m`;
}
setInterval(updateCountdown,1000);

// Heart explosion
function explodeHeart(){
    for(let i=0;i<15;i++){
        let heart=document.createElement('div');
        heart.className='heart';
        heart.innerText='❤️';
        heart.style.left=Math.random()*100+'vw';
        heart.style.top=Math.random()*100+'vh';
        heart.style.fontSize=(Math.random()*40+20)+'px';
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),800);
    }
}
</script>

</body>
</html>
